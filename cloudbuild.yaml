# Builds the Prime container and deploys it to Cloud Run.
# Usage:
#   gcloud builds submit --config cloudbuild.yaml
steps:
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/prime', '.']
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/prime']
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'prime'
      - '--image=gcr.io/$PROJECT_ID/prime'
      - '--region=${_REGION}'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--memory=1Gi'
      - '--cpu=1'
      - '--min-instances=0'
      - '--set-env-vars=NODE_ENV=production'
      # Required secrets (create them in Secret Manager first, see DEPLOYMENT.md)
      - '--set-secrets=SESSION_SIGNING_KEY_CURRENT=session-signing-key:latest,FIELD_ENCRYPTION_KEY_CURRENT=field-encryption-key:latest,ADMIN_CODE_PEPPER=admin-code-pepper:latest'
      # Optional integrations
      - '--set-secrets=TELEGRAM_BOT_TOKEN=telegram-bot-token:latest,GEOAPIFY_API_KEY=geoapify-api-key:latest,RECEIPT_ANALYZER_API_KEY=receipt-analyzer-api-key:latest'

substitutions:
  _REGION: us-central1

images:
  - 'gcr.io/$PROJECT_ID/prime'
