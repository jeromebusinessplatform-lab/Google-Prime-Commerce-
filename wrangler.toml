# Cloudflare Workers configuration for the PRIME commerce stack.
#
# Deploy (after `npm run build`):
#   npm run deploy:cloudflare
#
# First-time setup (see DEPLOYMENT-CLOUDFLARE.md):
#   npx wrangler d1 create prime-db
#   npx wrangler d1 migrations apply prime-db --remote
#   npx wrangler secret put SESSION_SIGNING_KEY_CURRENT
#   ...

name = "prime-commerce"
main = "dist-worker/index.js"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
preview_urls = false

# Production custom domain. Cloudflare provisions the Worker route for the
# hostname; DNS/zone ownership must be in the same Cloudflare account.
routes = [
  { pattern = "primecommerce.codespacelabs.online", custom_domain = true }
]

[[d1_databases]]
binding = "DB"
database_name = "prime-db"
database_id = "482cd1f2-9570-42e6-bc19-2c49a6c4071a"
migrations_dir = "migrations"

# Vite build output. The Worker handles SPA fallback routing itself:
# /shop -> storefront SPA, /admin -> admin SPA.
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "none"

[vars]
NODE_ENV = "production"
APP_ENV = "production"
