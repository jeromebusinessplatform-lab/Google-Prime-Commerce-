# Cloudflare Workers configuration for the PRIME commerce stack.
#
# Deploy (after `npm run build`):
#   npm run deploy:cloudflare
#
# Production deployment currently uses the Cloudflare Workers.dev hostname.
# The custom domain can be attached later once the zone/Workers Routes
# permission is available to the deployment token.

name = "prime-commerce"
main = "dist-worker/index.js"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
preview_urls = false

[[d1_databases]]
binding = "DB"
database_name = "prime-db"
database_id = "482cd1f2-9570-42e6-bc19-2c49a6c4071a"
migrations_dir = "migrations"

# Vite build output. The Worker handles SPA fallback routing itself:
# /shop -> storefront SPA, /admin -> admin SPA.
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "none"

[vars]
NODE_ENV = "production"
APP_ENV = "production"
