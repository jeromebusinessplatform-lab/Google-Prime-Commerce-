<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 120" width="540" height="120">
  <defs>
    <!-- Metallic Chrome Gradient -->
    <linearGradient id="chromeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="15%" stop-color="#e2e8f0" />
      <stop offset="35%" stop-color="#94a3b8" />
      <stop offset="48%" stop-color="#475569" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="52%" stop-color="#1e293b" />
      <stop offset="70%" stop-color="#94a3b8" />
      <stop offset="85%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- Bevel Inner Light -->
    <linearGradient id="bevelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#64748b" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#020617" stop-opacity="0.9" />
    </linearGradient>

    <!-- Outer Dark Shadow/Glow -->
    <filter id="bevelShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="1" dy="2" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.8" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="transparent"/>

  <g filter="url(#bevelShadow)">
    <!-- P -->
    <path d="M 25,18 L 105,18 C 125,18 135,28 135,43 C 135,58 125,68 105,68 L 52,68 L 52,102 L 25,102 Z M 52,38 L 52,48 L 100,48 C 106,48 110,45 110,43 C 110,41 106,38 100,38 Z" 
          fill="url(#chromeGrad)" stroke="url(#bevelGrad)" stroke-width="2.5" stroke-linejoin="round"/>

    <!-- R -->
    <path d="M 148,18 L 225,18 C 242,18 252,27 252,41 C 252,52 244,60 230,64 L 255,102 L 226,102 L 204,68 L 175,68 L 175,102 L 148,102 Z M 175,38 L 175,48 L 220,48 C 225,48 228,45 228,43 C 228,41 225,38 220,38 Z" 
          fill="url(#chromeGrad)" stroke="url(#bevelGrad)" stroke-width="2.5" stroke-linejoin="round"/>

    <!-- I -->
    <path d="M 265,18 L 290,18 L 290,102 L 265,102 Z" 
          fill="url(#chromeGrad)" stroke="url(#bevelGrad)" stroke-width="2.5" stroke-linejoin="round"/>

    <!-- M -->
    <path d="M 303,18 L 328,18 L 362,65 L 396,18 L 421,18 L 421,102 L 396,102 L 396,48 L 368,90 L 356,90 L 328,48 L 328,102 L 303,102 Z" 
          fill="url(#chromeGrad)" stroke="url(#bevelGrad)" stroke-width="2.5" stroke-linejoin="round"/>

    <!-- E (Three horizontal bars) -->
    <path d="M 434,18 L 520,18 L 520,38 L 434,38 Z" 
          fill="url(#chromeGrad)" stroke="url(#bevelGrad)" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M 434,50 L 520,50 L 520,70 L 434,70 Z" 
          fill="url(#chromeGrad)" stroke="url(#bevelGrad)" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M 434,82 L 520,82 L 520,102 L 434,102 Z" 
          fill="url(#chromeGrad)" stroke="url(#bevelGrad)" stroke-width="2.5" stroke-linejoin="round"/>
  </g>
</svg>