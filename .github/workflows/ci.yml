name: PRIME CI

on:
  push:
    branches: [main, 'gemini/**']
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Production Vite + server build
        run: npm run build

      - name: Cloudflare Worker build
        run: npm run worker:build

      - name: Cloudflare Worker smoke test
        run: npm run worker:smoke

      - name: Validate Wrangler configuration
        run: npx wrangler deploy --dry-run
